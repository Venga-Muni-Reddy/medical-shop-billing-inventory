# Free external scheduler: the free Render service sleeps when idle, so its own timer cannot run.
# This wakes it once a day (08:00 IST) and triggers the stock and expiry alert emails.
name: Daily stock alerts
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        run: |
          curl -sS --retry 4 --retry-delay 30 --retry-all-errors --max-time 150 \
            -X POST https://medshop-su9b.onrender.com/api/alerts/run
